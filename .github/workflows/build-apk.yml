name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret KEYSTORE_B64 belum diisi"; exit 1; fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > app/allchat.jks

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          gradle assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk AllChat.apk

      - name: Publish release (dipakai juga oleh fitur update di aplikasi)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AllChat v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: AllChat.apk
          make_latest: true

      - name: Salinan APK di CDN cadangan (jsDelivr) untuk jaringan yang memblokir githubusercontent
        run: |
          TAG=apk-v1.0.${{ github.run_number }}
          mkdir dist && cp AllChat.apk dist/
          cd dist
          git init -q -b dist
          git add AllChat.apk
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "APK v1.0.${{ github.run_number }}"
          git tag "$TAG"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist "$TAG"
          curl -s -o /dev/null -w "jsDelivr warmup: %{http_code}\n" "https://cdn.jsdelivr.net/gh/${{ github.repository }}@$TAG/AllChat.apk" || true
